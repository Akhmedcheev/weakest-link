# ============================================
# Конфигурация макропада для СЛАБОЕ ЗВЕНО
# Устройство: CH57x 3×3 + 1 крутилка
# ============================================
# Прошивка: .\macropad\ch57x-keyboard-tool.exe upload .\macropad\weakest-link-macropad.yaml
# ============================================
# Раскладка:
# ┌──────────┬──────────┬──────────┐
# │ 1: A     │ 2: B     │ 3: C     │
# │ CORRECT  │ WRONG    │ BANK     │
# ├──────────┼──────────┼──────────┤
# │ 4: D     │ 5: 💀    │ 6: E     │
# │ READY    │ СЛОМАНА  │ (резерв) │
# ├──────────┼──────────┼──────────┤
# │ 7: G     │ 8: H     │ 9: I     │
# │ (резерв) │ (резерв) │ (резерв) │
# └──────────┴──────────┴──────────┘
# 🔄 Крутилка: влево=громкость↓  нажатие=START O'CLOCK (F9)  вправо=громкость↑

orientation: normal
rows: 3
columns: 3
knobs: 1

layers:
  - buttons:
      - ["a", "b", "c"]
      - ["d", "a", "e"]
      - ["g", "h", "i"]
    knobs:
      - ccw: "volumedown"
        press: "f9"
        cw: "volumeup"
